version: '3.8'

services:

  sql-server-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql-server-db
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "StrongPassword123!"
    ports:
      - "1433:1433"

  glms-backend-api:
    build:
      context: .
      dockerfile: GLMS.API/Dockerfile
    container_name: glms-backend-api
    ports:
      - "7152:8080"
    depends_on:
      - sql-server-db

  glms-frontend-web:
    build:
      context: .
      dockerfile: GMLS_Part2/Dockerfile
    container_name: glms-frontend-web
    ports:
      - "5000:8080"
    depends_on:
      - glms-backend-api