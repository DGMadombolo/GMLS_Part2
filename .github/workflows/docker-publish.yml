name: Build and Push Docker Images

on:
  push:
    branches:
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Backend Image
        run: docker build -t freshdjstail/gmls-backend-api:latest -f GMLS.API/Dockerfile .

      - name: Push Backend Image
        run: docker push freshdjstail/gmls-backend-api:latest

      - name: Build Frontend Image
        run: docker build -t freshdjstail/gmls-frontend-web:latest -f GMLS_Part2/Dockerfile .

      - name: Push Frontend Image
        run: docker push freshdjstail/gmls-frontend-web:latest
